<!DOCTYPE html>
<!--
  Accord — M2: Submit a request (UI product-screen mode, §5.4)
  Purpose: a static, high-fidelity mockup of Accord's request flow on a phone.
  Sofia taps Thu 19 March on a neutral month calendar; a bottom sheet rises with
  the request-type choices (Holiday selected) and a Confirm CTA.
  The shared phone frame (300×650, soft rounded body, value-step + internal vignette,
  no shadow/notch/buttons) is inherited verbatim from M1.
  One orange moment = the "Confirm request" CTA. Nothing else is orange.
  James Oliver roster (Sofia). No JavaScript, no animation.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accord — M2 Submit a Request</title>

  <!-- IBM Plex Sans + IBM Plex Mono (loaded exactly as d9-setup-interview.html does) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Shared Accord diagram tokens (one level up from diagrams/svg/) -->
  <link rel="stylesheet" href="../diagram-tokens.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background: var(--bg-root);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* The figure stage — phone centred in dominant negative space (~60% empty). */
    .figure {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 96px;
    }

    /* Inner column at exactly the phone's width so the caption's left edge
       aligns to the phone's left edge (shared left margin). */
    .stack {
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      align-items: stretch;
    }

    /* ====================================================================
       SHARED PHONE FRAME — build IDENTICALLY across M1–M7 (reusable kit).
       Soft rounded body. Depth = value-step (card lighter than ground) +
       internal radial vignette + 1px hairline. NO shadow, NO glow, NO notch.
       ==================================================================== */
    .phone {
      position: relative;
      width: 300px;
      height: 650px;
      background: var(--surface-card);
      border: 1px solid var(--glass-hairline);
      border-radius: 44px;
      overflow: hidden;
    }
    /* Internal radial vignette — the only depth cue besides the value step.
       Sits above screen content but clipped to the rounded body. Not a shadow. */
    .phone::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(0,0,0,0.28));
      z-index: 5;
    }
    .screen {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    /* Load-bearing elements lifted ABOVE the vignette so they read full-strength. */
    .lift { position: relative; z-index: 10; }
    /* ==================================================================== */


    /* --- M2 screen content -------------------------------------------- */
    /* Top ~52%: neutral month calendar (no shift tints — this is the day-picker). */
    .m2-cal {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 24px 20px 0;
    }
    .m2-cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .m2-month {
      font-size: 15px;
      color: var(--text-secondary);
    }
    .m2-chevs {
      display: flex;
      gap: 16px;
      font-size: 15px;
      color: var(--text-tertiary);
    }
    .m2-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 8px;
    }
    .m2-weekdays span {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }
    .m2-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 8px;
    }
    .m2-grid .day {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--text-tertiary);
    }
    .m2-grid .day.sel {
      background: var(--surface-card-2);
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      border-radius: 9px;
      color: var(--text-primary);
    }

    /* Bottom sheet — request panel anchored to the lower edge, above the vignette. */
    .m2-sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: var(--surface-card-2);
      border-top: 1px solid var(--glass-hairline);
      border-radius: 20px 20px 0 0;
      padding: 14px 20px 20px;
    }
    .m2-grabber {
      width: 36px;
      height: 4px;
      background: var(--surface-edge);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .m2-sheet-head {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-tertiary);
      margin-bottom: 12px;
    }
    .m2-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 6px 10px;
      border-radius: 10px;
    }
    .m2-opt + .m2-opt {
      border-top: 1px solid var(--glass-hairline);
    }
    .m2-opt.sel {
      background: var(--glass-fill);
      border-top-color: transparent;
    }
    .m2-chip {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }
    .m2-opt-body { flex: 1; }
    .m2-opt-label {
      font-size: 15px;
      color: var(--text-secondary);
    }
    .m2-opt.sel .m2-opt-label { color: var(--text-primary); }
    .m2-opt-truth {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }
    /* Neutral radios — selected = filled, never orange. */
    .m2-radio {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
    }
    .m2-radio.filled { border: 1px solid var(--text-secondary); }
    .m2-radio.filled::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--text-secondary);
    }
    .m2-radio.hollow { border: 1px solid var(--text-muted); }

    /* THE ONE ORANGE MOMENT — the Confirm CTA. */
    .m2-confirm {
      margin-top: 18px;
      width: 100%;
      height: 46px;
      background: var(--accent);
      color: #0a0a0c;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="figure">
   <div class="stack">
    <div class="phone">
      <div class="screen">

        <!-- Neutral month calendar — choose a day -->
        <div class="m2-cal">
          <div class="m2-cal-head">
            <div class="m2-month">March 2026</div>
            <div class="m2-chevs"><span>&lsaquo;</span><span>&rsaquo;</span></div>
          </div>
          <div class="m2-weekdays">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
          </div>
          <div class="m2-grid">
            <!-- row 1: 1–7 -->
            <div class="day num">1</div><div class="day num">2</div><div class="day num">3</div>
            <div class="day num">4</div><div class="day num">5</div><div class="day num">6</div>
            <div class="day num">7</div>
            <!-- row 2: 8–14 -->
            <div class="day num">8</div><div class="day num">9</div><div class="day num">10</div>
            <div class="day num">11</div><div class="day num">12</div><div class="day num">13</div>
            <div class="day num">14</div>
            <!-- row 3: 15–21 (19 = tapped, Thursday) -->
            <div class="day num">15</div><div class="day num">16</div><div class="day num">17</div>
            <div class="day num">18</div><div class="day num sel">19</div><div class="day num">20</div>
            <div class="day num">21</div>
          </div>
        </div>

        <!-- Request bottom sheet (Confirm CTA = the one orange moment) -->
        <div class="m2-sheet lift">
          <div class="m2-grabber"></div>
          <div class="m2-sheet-head">New request &middot; Thu 19 March</div>

          <!-- Row 1 — Holiday (selected) -->
          <div class="m2-opt sel">
            <div class="m2-chip" style="background: var(--shift-h-bg); color: var(--shift-h-text);">H</div>
            <div class="m2-opt-body">
              <div class="m2-opt-label">Holiday</div>
              <div class="m2-opt-truth">Reduces your weekly target</div>
            </div>
            <div class="m2-radio filled"></div>
          </div>

          <!-- Row 2 — Day off -->
          <div class="m2-opt">
            <div class="m2-chip" style="background: var(--surface-edge); color: var(--shift-x-text);">X</div>
            <div class="m2-opt-body">
              <div class="m2-opt-label">Day off</div>
            </div>
            <div class="m2-radio hollow"></div>
          </div>

          <!-- Row 3 — Shift preference -->
          <div class="m2-opt">
            <div class="m2-chip" style="background: var(--surface-edge); color: var(--text-muted);">&middot;</div>
            <div class="m2-opt-body">
              <div class="m2-opt-label">Shift preference</div>
            </div>
            <div class="m2-radio hollow"></div>
          </div>

          <button class="m2-confirm">Confirm request</button>
        </div>

      </div>
    </div>

    <div class="fig-caption">FIG 10.2A - SUBMIT A REQUEST</div>
   </div>
  </div>
</body>
</html>
