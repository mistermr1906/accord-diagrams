<!DOCTYPE html>
<!--
  Accord — D26: Tracking Curves — demand-based generation.
  Single build per the 2026-06-06 panel verdict: same-x crest, staffing leads
  the rise by one module (180 vs 210), kiss-not-cross at (360,120), tail honesty
  (thread at-or-above demand), asymmetric steep-front/long-tail.
  Editorial / semi-abstract family (Bible §5.3 · diagrams/style-lock-editorial.md).
  Bare strokes on the page ground — no frame, no card, no vignette, no glass, no fills
  (text glyphs excepted). ONE ORANGE ELEMENT — the hollow ring at the shared crest.

  HEX → TOKEN MAP (SVG uses literal hex only; page furniture below uses CSS vars):
    #9ea3a9 = --stroke-wire-hi   (the staffing Thread, 4px — brightest grey)
    #868990 = --stroke-wire-mid  (the thin demand curve, 1px)
    #9e9e9e = --text-tertiary    (STAFFING / DEMAND mono micro-tags)
    #ee5f19 = --accent-orange    (the ONE orange element — hollow crest ring)

  GEOMETRY MATH (600×420 canvas = 20×14 modules of 30px):
    - STAFFING (the Thread, ONE path, 4px #9ea3a9, butt caps):
        M 0 240 L 180 240                       dead-flat lead-in
        C 270 240, 312 120, 360 120             rise — horizontal tangents at
                                                (180,240) and the crest (360,120);
                                                rise run = 180px (6 modules)
        C 440 120, 520 228, 600 228             fall — horizontal tangent at the
                                                crest; eases toward flat at the
                                                exit (control (520,228) = exit y);
                                                fall run = 240px (8 modules) —
                                                gentler than the 180px rise
    - DEMAND (thin, ONE path, 1px #868990, butt caps):
        M 0 264 L 210 264                       dead-flat lead-in — starts its
                                                climb ONE 30px MODULE after
                                                staffing (210 vs 180)
        C 270 264, 312 120, 360 120             rise — same control-point
                                                x-values (270, 312) as the
                                                staffing rise (shared clamp)
        C 440 120, 520 242, 600 242             fall — same control-point
                                                x-values (440, 520) as the
                                                staffing fall (shared clamp);
                                                ends 14px below staffing —
                                                below it through the whole tail
    - KISS-NOT-CROSS: both curves reach the SAME crest point (360,120) with
      horizontal tangents — they touch at exactly that one point. Tail
      separation at equal x = 14·(3t²−2t³) (same x(t) for both fall segments),
      monotonic 0 → 14px; rise separation grows from 0 at the crest to 24px in
      the flat channel. Separation ≥6px holds outside the convergence zone
      around the crest (x ≈ 330–456); inside it the curves converge smoothly —
      inherent to any smooth kiss.
    - FLAT CHANNEL: staffing 240 vs demand 264 = 24px — no tag enters it.
    - RING (the one orange element): circle (360,120) r=7, fill none,
      stroke #ee5f19, width 2. Both curve strokes pass through/under it —
      neither path terminates at or inside it.
    - TAGS: STAFFING — anchor start, x=6, baseline 226 (above the thick line's
      start, outside the channel). DEMAND — anchor start, x=6, baseline 284
      (below the thin line's start, outside the channel).
    - STROKE WIDTHS at the 600px reference: Thread 4px · demand 1px · ring 2px
    - PAINT ORDER = z-order: staffing Thread first, demand painted over the
      Thread — cited deviation from the appendix paint order so the thin crest
      stays traceable into the ring; separation ≥6px elsewhere makes it
      invisible outside the meeting zone — then tags, orange ring VERY last.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accord — D26 Demand-Based Generation</title>

  <!-- IBM Plex Sans + IBM Plex Mono (loaded exactly as shipped plates do) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Shared Accord diagram tokens (one level up from diagrams/svg/) -->
  <link rel="stylesheet" href="../diagram-tokens.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background: var(--bg-root);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* The figure stage — artwork floating in dominant negative space. */
    .figure {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 96px;
    }

    /* Fixed-width column: figure, stat, and FIG caption all hang from the
       SAME left edge (shared-left-margin rule — leftmost artwork ink is both
       curves entering at the SVG's own x=0, so the stack edge IS the ink
       edge). */
    .stack {
      width: 600px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .stat {
      margin-top: 20px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      color: var(--text-secondary);
    }

    .fig-caption {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="figure">
   <div class="stack">

    <svg viewBox="0 0 600 420" width="600" height="420" role="img"
         aria-labelledby="d26t d26d" shape-rendering="geometricPrecision"
         xmlns="http://www.w3.org/2000/svg">
      <title id="d26t">Staffing climbs ahead of demand</title>
      <desc id="d26d">A thick staffing curve starts climbing before the thin demand curve and meets its crest on time; an orange ring marks the meeting.</desc>

      <!-- THE THREAD (staffing) — one path. Flat to x=180, rises to the crest
           (360,120) with horizontal tangents at both ends, eases down a longer
           tail to (600,228). Painted first (cited deviation — demand goes on
           top so the 1px line stays traceable into the ring). -->
      <path d="M 0 240 L 180 240 C 270 240, 312 120, 360 120 C 440 120, 520 228, 600 228"
            fill="none" stroke="#9ea3a9" stroke-width="4"
            stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" />

      <!-- DEMAND — one thin path on top of the Thread. Flat to x=210 (one
           module after staffing), rises on the same control-point x-values to
           the same crest, falls to (600,242) — below staffing through the
           whole tail. -->
      <path d="M 0 264 L 210 264 C 270 264, 312 120, 360 120 C 440 120, 520 242, 600 242"
            fill="none" stroke="#868990" stroke-width="1"
            stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" />

      <!-- Mono micro-tags — one per curve, at the left edge, outside the 24px
           channel between the curves. -->
      <text x="6" y="226" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace"
            font-size="11" font-weight="400" letter-spacing="0.66" fill="#9e9e9e">STAFFING</text>
      <text x="6" y="284" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace"
            font-size="11" font-weight="400" letter-spacing="0.66" fill="#9e9e9e">DEMAND</text>

      <!-- THE RING — the one orange element, painted very last, at the shared
           crest. Both curves pass under it; neither terminates inside it. -->
      <circle cx="360" cy="120" r="7" fill="none" stroke="#ee5f19" stroke-width="2" />
    </svg>

    <div class="stat num">2 curves · 1 peak staffed</div>
    <div class="fig-caption">FIG 19.3A - STAFFING CLIMBS AHEAD OF DEMAND</div>

   </div>
  </div>
</body>
</html>
