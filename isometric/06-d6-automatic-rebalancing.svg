<?xml version="1.0" encoding="UTF-8"?>
<!--
  Accord landing page — Section 06 · D6 Automatic rebalancing (clean-line redesign · 2026-06-07)
  Supersedes: the 2026-04-17 transparent-wireframe build — same designer-confirmed concept
              (V-trough + settled cube), "nested valley" execution: the trough re-proportioned
              so the cube nests with clear air; crease breaks behind the solid cube; no
              hidden-edge strokes; one crossing-break in A→E.
  Style-lock: diagrams/style-lock-isometric.md
  Precedent:  D8 final (06-d8-first-publish-reliability.svg) — "opaque by omission".
  Review:     diagrams/reviews/d6-redesign.md

  Metaphor: A concave V-trough in isometric wireframe — two sloping inner walls meeting
            at a horizontal crease along the floor — with a single small cube settled
            at the lowest point of the valley. Gravity found the cube's resting place;
            the geometry of the well made it inevitable; no hand, no machinery, no
            trajectory lines. Emotional territory: invisibility · automatic correction.

  Geometry — true 30° isometric, parallel projection:
    screen_x = 200 + 0.866·(X − Y)
    screen_y = 147 + 0.5·(X + Y) − Z

  Trough — length L=216 (along X, half=108), width W=88 (along Y, half=44), depth D=96:
    A (−108, −44,  0) → (144.58,  71)   top-rim · back-far side · back corner
    B (+108, −44,  0) → (331.63, 179)   top-rim · back-far side · front corner
    C (+108, +44,  0) → (255.42, 223)   top-rim · near side · front corner
    D (−108, +44,  0) → ( 68.37, 115)   top-rim · near side · back corner
    E (−108,   0, −96)→ (106.47, 189)   crease · back end
    F (+108,   0, −96)→ (293.53, 297)   crease · front end

  Why these proportions: screen clearance between near-rim line and crease
    = d − w = 96 − 44 = 52px; the 40px-tall cube fits with 12px air. The near rim C→D
    now passes ~22px ABOVE the cube's top corner (rim y=191 at x=200; cube top y=213) —
    nothing touches the cube except the crease it sits on.
  Bounds: width 263px = 65.8% of canvas (60–70% rule) · y 71→297, centred on the
    optical centre (200, 184).

  Occlusion edits:
    · A→E (secondary, back slope) breaks 6px where it passes behind the brighter near
      rim C→D — crossing centre (120.63, 145.17): drawn as A→(121.55, 142.32) and
      (119.70, 148.03)→E.
    · Crease E→F breaks behind the solid cube: E→(182.68, 233) — entry exactly on the
      cube's left vertical silhouette edge at its midpoint — and (208.66, 248)→F —
      exit exactly on the bottom-right silhouette edge at its midpoint.
    · No hidden cube edges — the cube is a solid mass, opaque by omission.

  Cube — iso cube, side 20, centred at world (0, 0, −86); bottom face rests on crease:
    Silhouette hexagon (CW from top): (200, 213) · (217.32, 223) · (217.32, 243) ·
      (200, 253) · (182.68, 243) · (182.68, 223)
    Visible interior corner (front-top): (200, 233)
    9 strokes total: 6 silhouette + 2 visible interior edges + 1 accent. No hidden edges.

  Orange — single edge on the settled cube: the top-face near-right edge
    FRONT-TOP (200, 233) → TOP-RIGHT (217.32, 223). Short diagonal glint on the top
    of the rested mass.

  Canvas: 400×400 · 1:1 square · container supplies dark ground (#0a0a0c) per
  style-lock container rules.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400"
     role="img"
     aria-labelledby="d6-title d6-desc"
     shape-rendering="geometricPrecision"
     fill="none">
  <title id="d6-title">Automatic rebalancing</title>
  <desc id="d6-desc">A concave isometric V-trough with a single small cube settled at the lowest point of the valley — representing weekly shift targets quietly self-adjusting to the stable resting state with no intervention.</desc>

  <defs>
    <style>
      .primary   { stroke: #e8e8ea; stroke-width: 1;    fill: none; vector-effect: non-scaling-stroke; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4; }
      .secondary { stroke: #5a5a60; stroke-width: 0.75; fill: none; vector-effect: non-scaling-stroke; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4; }
      .accent    { stroke: #f7693b; stroke-width: 1;    fill: none; vector-effect: non-scaling-stroke; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4; }
    </style>
  </defs>

  <!-- Trough · back-end V-cross-section + far rim + back slopes (secondary · receding) -->
  <g aria-hidden="true">
    <line class="secondary" x1="68.37"  y1="115"    x2="144.58" y2="71"     /><!-- D→A  back-end rim -->
    <line class="secondary" x1="144.58" y1="71"     x2="331.63" y2="179"    /><!-- A→B  far-side top rim -->
    <line class="secondary" x1="68.37"  y1="115"    x2="106.47" y2="189"    /><!-- D→E  back-near slope edge -->
    <line class="secondary" x1="144.58" y1="71"     x2="121.55" y2="142.32" /><!-- A→E  back-far slope · upper segment (breaks behind near rim C→D) -->
    <line class="secondary" x1="119.70" y1="148.03" x2="106.47" y2="189"    /><!-- A→E  back-far slope · lower segment -->
  </g>

  <!-- Trough · front-end V-cross-section + near rim + crease (primary · foreground) -->
  <g aria-hidden="true">
    <line class="primary" x1="331.63" y1="179" x2="255.42" y2="223" /><!-- B→C  front-end rim  -->
    <line class="primary" x1="255.42" y1="223" x2="68.37"  y2="115" /><!-- C→D  near-side top rim (passes ~22px above the cube — clear air) -->
    <line class="primary" x1="331.63" y1="179" x2="293.53" y2="297" /><!-- B→F  front-far slope -->
    <line class="primary" x1="255.42" y1="223" x2="293.53" y2="297" /><!-- C→F  front-near slope -->
    <line class="primary" x1="106.47" y1="189" x2="182.68" y2="233" /><!-- E→F  crease · back segment (dies at cube left silhouette edge) -->
    <line class="primary" x1="208.66" y1="248" x2="293.53" y2="297" /><!-- E→F  crease · front segment (re-emerges at bottom-right silhouette edge) -->
  </g>

  <!-- Cube · silhouette hexagon (primary) — solid mass, no hidden edges -->
  <g aria-hidden="true">
    <line class="primary" x1="200"    y1="213" x2="217.32" y2="223" /><!-- back-top → top-right -->
    <line class="primary" x1="217.32" y1="223" x2="217.32" y2="243" /><!-- top-right → bottom-right -->
    <line class="primary" x1="217.32" y1="243" x2="200"    y2="253" /><!-- bottom-right → front-bottom -->
    <line class="primary" x1="200"    y1="253" x2="182.68" y2="243" /><!-- front-bottom → bottom-left -->
    <line class="primary" x1="182.68" y1="243" x2="182.68" y2="223" /><!-- bottom-left → top-left -->
    <line class="primary" x1="182.68" y1="223" x2="200"    y2="213" /><!-- top-left → back-top -->
  </g>

  <!-- Cube · visible interior edges from front-top corner (primary · third edge is the orange accent) -->
  <g aria-hidden="true">
    <line class="primary" x1="200" y1="233" x2="200"    y2="253" /><!-- front-top → front-bottom (vertical front) -->
    <line class="primary" x1="200" y1="233" x2="182.68" y2="223" /><!-- front-top → top-left     (top-face diagonal) -->
  </g>

  <!-- Orange · single spotlight · top-face near-right edge of the settled cube -->
  <line class="accent" x1="200" y1="233" x2="217.32" y2="223" />

</svg>
