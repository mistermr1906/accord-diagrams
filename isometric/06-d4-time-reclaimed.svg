<?xml version="1.0" encoding="UTF-8"?>
<!--
  Accord landing page — Section 06 · D4 Time reclaimed (hourglass rebuild)
  Supersedes: the previous landscape "long-bar-collapsed" mechanic (rejected 2026-04-17).
  Style-lock:  diagrams/style-lock-isometric.md
  Benchmark:   Stat Row A (A1 hexagonal cluster · A2 stacked planes · A3 converging planes)
  Metaphor:
    Isometric hourglass — dual square-base pyramids meeting apex-to-apex at a single waist
    point. Upper chamber empty (90%+); lower chamber densely stratified (95% full) — the
    work is complete, the time has been given back. One orange grain suspended just above the
    waist joint, the last grain about to settle. Reads as completion, not pressure.

  Geometry — true 30° isometric, parallel projection:
    screen_x = 200 + 0.866·(X − Y)
    screen_y = 184 + 0.5·(X + Y) − Z          (waist origin → canvas optical centre 200, 184)
    Half-base W = 40 · Chamber half-height H = 80
    Shape extent: 240 px tall (60% of canvas) · 138.56 px wide · well under the 70% ceiling

  Vertex schedule (canvas coords):
    Upper-back  UB (−40,−40,+80) → (200, 64)
    Upper-right UR (+40,−40,+80) → (269.28, 104)
    Upper-front UF (+40,+40,+80) → (200, 144)
    Upper-left  UL (−40,+40,+80) → (130.72, 104)
    Waist        W (  0,  0,  0) → (200, 184)
    Lower-back  LB (−40,−40,−80) → (200, 224)
    Lower-right LR (+40,−40,−80) → (269.28, 264)
    Lower-front LF (+40,+40,−80) → (200, 304)
    Lower-left  LL (−40,+40,−80) → (130.72, 264)

  Note on collinearity: front-corner and back-corner of each rhombus project to the same
  screen-x (= 200). The upper front slant W→UF and upper back slant W→UB therefore share
  the segment y ∈ [144, 184]; only the non-overlapping upper portion of the back slant
  (y ∈ [64, 144]) is drawn at secondary weight. The lower back slant is entirely
  collinear with the lower front slant and is omitted (would render as a dashed tertiary
  under an already-solid primary line).

  Canvas: 400×400 viewBox · 1:1 square · container supplies dark ground (#0a0a0c) +
          12 ambient gridlines per style-lock container rules.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400"
     role="img"
     aria-labelledby="d4-title d4-desc"
     shape-rendering="geometricPrecision"
     fill="none">
  <title id="d4-title">Time reclaimed</title>
  <desc id="d4-desc">An isometric hourglass with an empty upper chamber and a densely stratified lower chamber; a single orange grain sits just above the waist — representing four hours of setup compressed to sixty seconds.</desc>

  <defs>
    <style>
      .primary   { stroke: #e8e8ea; stroke-width: 1;    fill: none; vector-effect: non-scaling-stroke; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4; }
      .secondary { stroke: #5a5a60; stroke-width: 0.75; fill: none; vector-effect: non-scaling-stroke; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4; }
      .tertiary  { stroke: #33333a; stroke-width: 0.5;  fill: none;                                    stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4; }
      .hidden    { stroke: #33333a; stroke-width: 0.5;  fill: none; stroke-dasharray: 3 3;             stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4; }
      .accent    { fill: #ee5f19; stroke: none; }
    </style>
  </defs>

  <!-- Lower chamber: 10 horizontal sand strata at tertiary weight · fills z ∈ [−76, −4] (95%) -->
  <g aria-hidden="true">
    <line class="tertiary" x1="134.18" y1="260" x2="265.82" y2="260" /><!-- z=-76 -->
    <line class="tertiary" x1="141.11" y1="252" x2="258.89" y2="252" /><!-- z=-68 -->
    <line class="tertiary" x1="148.04" y1="244" x2="251.96" y2="244" /><!-- z=-60 -->
    <line class="tertiary" x1="154.97" y1="236" x2="245.03" y2="236" /><!-- z=-52 -->
    <line class="tertiary" x1="161.90" y1="228" x2="238.10" y2="228" /><!-- z=-44 -->
    <line class="tertiary" x1="168.82" y1="220" x2="231.18" y2="220" /><!-- z=-36 -->
    <line class="tertiary" x1="175.75" y1="212" x2="224.25" y2="212" /><!-- z=-28 -->
    <line class="tertiary" x1="182.68" y1="204" x2="217.32" y2="204" /><!-- z=-20 -->
    <line class="tertiary" x1="189.61" y1="196" x2="210.39" y2="196" /><!-- z=-12 -->
    <line class="tertiary" x1="196.54" y1="188" x2="203.46" y2="188" /><!--  z=-4 -->
  </g>

  <!-- Lower rim back edges — hidden behind solid lower-pyramid body (dashed tertiary) -->
  <g aria-hidden="true">
    <line class="hidden" x1="269.28" y1="264" x2="200"    y2="224" />
    <line class="hidden" x1="200"    y1="224" x2="130.72" y2="264" />
  </g>

  <!-- Receding upper-rim back edges + upper back slant (secondary · visible but receding) -->
  <g aria-hidden="true">
    <line class="secondary" x1="269.28" y1="104" x2="200"    y2="64" />
    <line class="secondary" x1="200"    y1="64"  x2="130.72" y2="104" />
    <line class="secondary" x1="200"    y1="64"  x2="200"    y2="144" /><!-- non-overlapping part of W→UB -->
  </g>

  <!-- Front silhouette + visible slants (primary · foreground) -->
  <g aria-hidden="true">
    <!-- Upper rim, front 2 edges -->
    <line class="primary" x1="200" y1="144" x2="269.28" y2="104" />
    <line class="primary" x1="200" y1="144" x2="130.72" y2="104" />
    <!-- Upper pyramid, 3 visible slants from waist apex -->
    <line class="primary" x1="200" y1="184" x2="200"    y2="144" />
    <line class="primary" x1="200" y1="184" x2="269.28" y2="104" />
    <line class="primary" x1="200" y1="184" x2="130.72" y2="104" />
    <!-- Lower pyramid, 3 visible slants from waist apex -->
    <line class="primary" x1="200" y1="184" x2="200"    y2="304" />
    <line class="primary" x1="200" y1="184" x2="269.28" y2="264" />
    <line class="primary" x1="200" y1="184" x2="130.72" y2="264" />
    <!-- Lower rim, front 2 edges -->
    <line class="primary" x1="200" y1="304" x2="269.28" y2="264" />
    <line class="primary" x1="200" y1="304" x2="130.72" y2="264" />
  </g>

  <!-- Orange grain · the single spotlight · suspended just above the waist joint (world z=+5) -->
  <polygon class="accent" points="200,176 205,179 200,182 195,179" />

</svg>
