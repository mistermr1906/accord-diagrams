<?xml version="1.0" encoding="UTF-8"?>
<!--
  Accord landing page — Section 06 · D8 First-publish reliability
  Fan-out panel winner 2026-06-07: "THE VAULT SEAM"
  Selected by Robert 2026-06-07 as the final D8 — replaces the original three-tier
  ziggurat (deleted same day); renamed from 06-d8-first-publish-reliability-v2.svg.
  Style-lock: diagrams/style-lock-isometric.md
              (accent colour superseded 2026-06-04: the lock's original blue accent is
              dead — accent is orange #f7693b; see
              diagrams/reviews/06-isometric-orange-retrofit.md)

  Metaphor: One tall sealed monolith; the only event on the mass is the level orange
            seam where the lid closed. Reads: sealed, complete, checked before anyone
            saw inside.

  Geometry — true 30° isometric, parallel projection:
    screen_x = 200 + 0.866·(X − Y)
    screen_y = 259 + 0.5·(X + Y) − Z

  Volume — square footprint half-width a=48, height h=150, seam at Z=120:
    Bottom rhombus (Z=0):    B_back (200, 211) · B_right (283.14, 259) ·
                             B_front (200, 307) · B_left (116.86, 259)
    Top rhombus    (Z=150):  T_back (200,  61) · T_right (283.14, 109) ·
                             T_front (200, 157) · T_left (116.86, 109)
    Seam points    (Z=120):  S_left (116.86, 139) · S_front (200, 187) ·
                             S_right (283.14, 139)

  Shape bounds: x ∈ [116.86, 283.14] (width 166.28) · y ∈ [61, 307] (height 246,
                61.5% of canvas — within the 60–70% rule) · vertical centre 184
                (optical centre).

  Edge roster:
    SECONDARY (2) — top back edges T_left→T_back · T_back→T_right (receding lid)
    PRIMARY   (7) — 2 silhouette verticals · 2 bottom near edges · 2 top near edges ·
                    front vertical
    ORANGE    (1) — ONE continuous polyline S_left → S_front → S_right; the level
                    seam wrapping the front corner where the lid closed
    No back verticals, no bottom back edges, no broken hidden-edge strokes — the mass
    is opaque by omission.

  Canvas: 400×400 · 1:1 square · container supplies dark ground (#0a0a0c) per
  style-lock container rules.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400"
     role="img"
     aria-labelledby="d8v2-title d8v2-desc"
     shape-rendering="geometricPrecision"
     fill="none">
  <title id="d8v2-title">First-publish reliability</title>
  <desc id="d8v2-desc">A tall sealed isometric monolith. A single level orange seam wraps the front corner near the top — the line where the lid closed: every rule checked and sealed before anyone saw the rota; what publishes on Monday holds on Friday.</desc>

  <defs>
    <style>
      .primary   { stroke: #e8e8ea; stroke-width: 1;    fill: none; vector-effect: non-scaling-stroke; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4; }
      .secondary { stroke: #5a5a60; stroke-width: 0.75; fill: none; vector-effect: non-scaling-stroke; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4; }
      .accent    { stroke: #f7693b; stroke-width: 1;    fill: none; vector-effect: non-scaling-stroke; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4; }
    </style>
  </defs>

  <!-- Top back edges (receding lid) · secondary · drawn first (behind) -->
  <g aria-hidden="true">
    <line class="secondary" x1="116.86" y1="109" x2="200"    y2="61"  /><!-- T_left  → T_back  -->
    <line class="secondary" x1="200"    y1="61"  x2="283.14" y2="109" /><!-- T_back  → T_right -->
  </g>

  <!-- Monolith silhouette + front vertical · primary -->
  <g aria-hidden="true">
    <line class="primary" x1="283.14" y1="109" x2="283.14" y2="259" /><!-- T_right → B_right  silhouette vertical right -->
    <line class="primary" x1="116.86" y1="109" x2="116.86" y2="259" /><!-- T_left  → B_left   silhouette vertical left  -->
    <line class="primary" x1="283.14" y1="259" x2="200"    y2="307" /><!-- B_right → B_front  bottom near edge right    -->
    <line class="primary" x1="200"    y1="307" x2="116.86" y2="259" /><!-- B_front → B_left   bottom near edge left     -->
    <line class="primary" x1="200"    y1="157" x2="283.14" y2="109" /><!-- T_front → T_right  top near edge right       -->
    <line class="primary" x1="200"    y1="157" x2="116.86" y2="109" /><!-- T_front → T_left   top near edge left        -->
    <line class="primary" x1="200"    y1="157" x2="200"    y2="307" /><!-- T_front → B_front  front vertical            -->
  </g>

  <!-- Orange · single spotlight · the level seam where the lid closed · ONE continuous polyline -->
  <polyline class="accent" points="116.86,139 200,187 283.14,139" /><!-- S_left → S_front → S_right -->

</svg>
