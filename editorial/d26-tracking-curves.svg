<!-- EXPORT ARTIFACT — the HTML plate diagrams/svg/d26-tracking-curves.html is the source of truth; regenerate this file on any change. Generated 2026-06-06. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" shape-rendering="geometricPrecision" role="img" aria-labelledby="d26t d26d">
  <title id="d26t">Staffing climbs ahead of demand</title>
  <desc id="d26d">A thick staffing curve starts climbing before the thin demand curve and meets its crest on time; an orange ring marks the meeting.</desc>
  <rect x="0" y="0" width="600" height="500" fill="#0a0a0c"/>
  <g>
      <!-- THE THREAD (staffing) — one path. Flat to x=180, rises to the crest
           (360,120) with horizontal tangents at both ends, eases down a longer
           tail to (600,228). Painted first (cited deviation — demand goes on
           top so the 1px line stays traceable into the ring). -->
      <path d="M 0 240 L 180 240 C 270 240, 312 120, 360 120 C 440 120, 520 228, 600 228"
            fill="none" stroke="#9ea3a9" stroke-width="4"
            stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" />

      <!-- DEMAND — one thin path on top of the Thread. Flat to x=210 (one
           module after staffing), rises on the same control-point x-values to
           the same crest, falls to (600,242) — below staffing through the
           whole tail. -->
      <path d="M 0 264 L 210 264 C 270 264, 312 120, 360 120 C 440 120, 520 242, 600 242"
            fill="none" stroke="#868990" stroke-width="1"
            stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" />

      <!-- Mono micro-tags — one per curve, at the left edge, outside the 24px
           channel between the curves. -->
      <text x="6" y="226" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace"
            font-size="11" font-weight="400" letter-spacing="0.66" fill="#9e9e9e">STAFFING</text>
      <text x="6" y="284" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace"
            font-size="11" font-weight="400" letter-spacing="0.66" fill="#9e9e9e">DEMAND</text>

      <!-- THE RING — the one orange element, painted very last, at the shared
           crest. Both curves pass under it; neither terminates inside it. -->
      <circle cx="360" cy="120" r="7" fill="none" stroke="#ee5f19" stroke-width="2" />
  </g>
  <text x="0" y="455" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#b2b2b2">2 curves · 1 peak staffed</text>
  <text x="0" y="480" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.66" fill="#6e7176">FIG 19.3A - STAFFING CLIMBS AHEAD OF DEMAND</text>
</svg>
