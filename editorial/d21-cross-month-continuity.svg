      <line x1="105" y1="313" x2="290" y2="313" stroke="#6f7277" stroke-width="0.5" stroke-opacity="0.55" stroke-linecap="butt" />

      <!-- MARCH field — hairline rules at full opacity. -->
      <line x1="310" y1="73"  x2="495" y2="73"  stroke="#6f7277" stroke-width="0.5" stroke-linecap="butt" />
      <line x1="310" y1="103" x2="495" y2="103" stroke="#6f7277" stroke-width="0.5" stroke-linecap="butt" />
      <line x1="310" y1="133" x2="495" y2="133" stroke="#6f7277" stroke-width="0.5" stroke-linecap="butt" />
