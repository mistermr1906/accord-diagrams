  <title id="d21t">The schedule is continuous when the calendar resets</title>
  <desc id="d21d">One schedule continuing across the month boundary: a single thread crossing the seam between February and March unbroken.</desc>
  <rect x="0" y="0" width="600" height="500" fill="#0a0a0c"/>
  <g>
      <!-- FEBRUARY field — hairline rules at 0.55 opacity (the past month,
